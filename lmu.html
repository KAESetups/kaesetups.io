<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Mans Ultimate | KAE Setups</title>
    
    <!-- PASO 1: El traductor de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0d0d0d;
            --neon-green: #D6FE00;
            --text-white: #FFFFFF;
            --text-gray: #a0a0a0;
            --border-color: #222222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-white); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

        /* Navbar actualizada */
        .navbar {
            width: 100%;
            background-color: rgba(13, 13, 13, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2.5rem;
            position: sticky; top: 0; z-index: 1000;
        }

        .nav-brand { font-family: 'Orbitron', sans-serif; font-size: 1.25rem; font-weight: 700; color: var(--text-white); text-decoration: none; display: flex; align-items: center; gap: 12px; }
        .nav-brand span { color: var(--neon-green); }

        .nav-links { display: flex; gap: 2rem; list-style: none; align-items: center; }
        .nav-links > li > a { color: var(--text-gray); text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 0.9rem; transition: 0.2s; }
        .nav-links > li > a:hover { color: var(--neon-green); }

        /* Estilo del Botón de Login */
        .btn-login {
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }
        .btn-login:hover { background: var(--neon-green); color: black; }

        .container { width: 100%; max-width: 900px; padding: 3rem 1rem; }
        .page-title { margin-bottom: 2rem; border-bottom: 2px solid var(--neon-green); padding-bottom: 1rem; }
        footer { width: 100%; background-color: var(--card-bg); padding: 2rem; text-align: center; color: var(--text-gray); margin-top: auto; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <img src="image.png" alt="KAE Logo" style="width:36px;"> KAE <span>Setups</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="lmu.html" style="color: var(--neon-green);">Simuladores</a></li>
            <li><a href="#">Servicios</a></li>
            <!-- Botón de Login -->
            <li><button id="login-btn" class="btn-login" onclick="handleAuth()">Iniciar Sesión</button></li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="page-title">Le Mans Ultimate</h1>
        <p>Aquí encontrarás todos los reglajes disponibles para LMU.</p>
    </div>

    <footer>&copy; 2026 KAE Setups. #BUILTDIFFERENT</footer>

    <!-- PASO 3: Vincular el script de login -->
    <script src="auth.js"></script>
</body>
</html>
